name: ci
on:
  push:
  pull_request:

jobs:
  go:
    name: build / vet / test (unprivileged)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go build ./...
      - run: go vet ./...
      # Unit + end-to-end tests use the mock executor: no kernel/root needed.
      - run: go test ./... -count=1
        env:
          TRACESLEUTH_EXECUTOR: mock

  policy:
    name: opa test (safety-critical, required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: latest
      - run: opa fmt --list policy/    # must print nothing
      - run: opa test ./policy/ -v

  # Real bpftrace execution needs a privileged runner with kernel access. Kept as
  # a separate, non-blocking job so the fast checks above don't need root.
  integration:
    name: bpftrace integration (privileged)
    runs-on: ubuntu-latest
    if: ${{ false }} # enable on a self-hosted privileged runner with bpftrace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: |
          sudo apt-get update && sudo apt-get install -y bpftrace
          echo "$USER ALL=(root) NOPASSWD: $(command -v bpftrace)" | sudo tee /etc/sudoers.d/tracesleuth
          go test ./... -tags integration -count=1
